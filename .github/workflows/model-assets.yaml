name: Model assets

# Publishes the search model's files to the pre-release tag the manifest names;
# the app downloads the model from that tag. Runs by itself when a push to main
# changes the manifest or this file, and by hand from main. A pre-release that
# already holds every file of the manifest, uploaded whole, is left as it is.
on:
  push:
    branches:
      - main
    paths:
      - apps/ui/src/main/search-model/search-model.manifest.json
      - .github/workflows/model-assets.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-assets
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Check the published pre-release against the manifest
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          MANIFEST: apps/ui/src/main/search-model/search-model.manifest.json
        run: |
          set -euo pipefail
          tag="$(jq -r '.tag' "$MANIFEST")"
          release="$RUNNER_TEMP/release.json"
          if ! gh api "repos/$REPO_SLUG/releases/tags/$tag" > "$release" 2> "$RUNNER_TEMP/release.err"; then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/release.err"; then
              echo "No release for $tag yet: publishing it."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi
          if [[ "$(jq -r '.prerelease' "$release")" != "true" ]]; then
            echo "error: the release $tag exists but is not a pre-release; the model must never be a regular release" >&2
            exit 1
          fi
          asset_of() {
            jq -r --arg name "$1" '[.assets[] | select(.name == $name)][0] // {} | [(.state // "absent"), ((.size // 0) | tostring), (.digest // "")] | @tsv' "$release"
          }
          stale=()
          while IFS=$'\t' read -r name bytes sha256; do
            IFS=$'\t' read -r state size digest < <(asset_of "$name")
            if [[ "$state" != "uploaded" ]]; then
              stale+=("$name is $state")
            elif [[ "$size" != "$bytes" ]]; then
              stale+=("$name is $size bytes, the manifest says $bytes")
            elif [[ -n "$digest" && "$digest" != "sha256:$sha256" ]]; then
              stale+=("$name has $digest, the manifest says sha256:$sha256")
            fi
          done < <(jq -r '.files[] | [.name, (.bytes | tostring), .sha256] | @tsv' "$MANIFEST")
          IFS=$'\t' read -r state size _ < <(asset_of SHA256SUMS.txt)
          if [[ "$state" != "uploaded" || "$size" == "0" ]]; then
            stale+=("SHA256SUMS.txt is $state")
          fi
          if (( ${#stale[@]} == 0 )); then
            echo "The pre-release $tag already holds every file of the manifest: nothing to publish."
            echo "Nothing to publish: \`$tag\` already holds every file of the manifest." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Publishing %s: %s\n' "$tag" "${stale[@]}"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download the files and check them against the manifest
        if: steps.published.outputs.publish == 'true'
        env:
          MANIFEST: apps/ui/src/main/search-model/search-model.manifest.json
        run: |
          set -euo pipefail
          repo="$(jq -r '.repo' "$MANIFEST")"
          revision="$(jq -r '.revision' "$MANIFEST")"
          jq -r '.files[] | [.name, .source, (.bytes | tostring), .sha256] | @tsv' "$MANIFEST" > "$RUNNER_TEMP/files.tsv"
          mkdir dist
          while IFS=$'\t' read -r name source bytes sha256; do
            curl -fL --retry 3 -o "dist/$name" "https://huggingface.co/$repo/resolve/$revision/$source"
            size="$(stat -c %s "dist/$name")"
            if [[ "$size" != "$bytes" ]]; then
              echo "error: $name is $size bytes, the manifest says $bytes" >&2
              exit 1
            fi
            digest="$(shasum -a 256 "dist/$name" | cut -d' ' -f1)"
            if [[ "$digest" != "$sha256" ]]; then
              echo "error: $name has sha256 $digest, the manifest says $sha256" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/files.tsv"
          mapfile -t names < <(cut -f1 "$RUNNER_TEMP/files.tsv")
          (cd dist && shasum -a 256 "${names[@]}" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish the pre-release
        if: steps.published.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          MANIFEST: apps/ui/src/main/search-model/search-model.manifest.json
        run: |
          set -euo pipefail
          tag="$(jq -r '.tag' "$MANIFEST")"
          revision="$(jq -r '.revision' "$MANIFEST")"
          title="Search model: EmbeddingGemma 2 (${revision:0:7})"
          mapfile -t names < <(jq -r '.files[].name' "$MANIFEST")
          assets=()
          for name in "${names[@]}"; do
            assets+=("dist/$name")
          done
          assets+=("dist/SHA256SUMS.txt")
          notes="EmbeddingGemma 2 (text part) for Geniro's \"Search by meaning\", ONNX export by onnx-community from google/embeddinggemma-2 at revision ${revision}.
          Model card: https://huggingface.co/google/embeddinggemma-2
          Licence: Apache-2.0
          Deployments must adhere to the Gemma Prohibited Use Policy: https://ai.google.dev/gemma/prohibited_use_policy
          The app checks each file against SHA256SUMS.txt before it uses it."
          if gh release view "$tag" -R "$REPO_SLUG" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" -R "$REPO_SLUG" --clobber
          else
            gh release create "$tag" "${assets[@]}" -R "$REPO_SLUG" --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"
          fi
