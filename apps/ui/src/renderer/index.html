<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:*; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self' http://127.0.0.1:*" />
    <!--
      `frame-src 'self'` is for the PHONE: over the LAN gateway or a tunnel the
      daemon is reached through the page's own origin, so an artifact frame's
      URL is same-origin there and `http://127.0.0.1:*` alone blocked it — the
      card drew a blank white box. The frame is still `sandbox="allow-scripts"`,
      an opaque origin, so being served from 'self' gives the page no reach in.
    -->
    <!--
      This tag is for the PHONE, over the LAN gateway (Electron ignores it). No
      `maximum-scale`/`user-scalable=no`: those disable pinch-zoom on Android
      Chrome and Samsung Internet (WCAG 1.4.4), where iOS merely ignores them
      for pinch. iOS Safari's own auto-zoom, which fires on any focused field
      under 16px, is avoided instead by giving fields 16px below `sm`: the
      Input and Textarea primitives carry `max-sm:text-base`.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geniro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
